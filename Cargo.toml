[package]
name = "async-watcher"
description = "Trigger events when files or directories change"
authors = ["Justin Rubek"]
edition = "2024"
homepage = "https://github.com/prfiredragon/async-watcher"
license = "MIT"
readme = "README.md"
repository = "https://github.com/prfiredragon/async-watcher"
version = "0.4.0"

[dependencies]
async-trait = "0.1.68"
serde = "1.0.219"
tokio = { version = "1.47.1", features = ["full", "io-std", "io-util", "process"] }
thiserror = "2.0.16"
notify = "8.2.0"
